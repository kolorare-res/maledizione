<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Maledizione delle Cinque Giornate - AR</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Configurazioni esterne (opzionali) -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Scena AR con parametri anti-traballamento avanzati (filterMinCF molto basso, filterBeta elevato) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 1000; warmups: 5; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore del target riconosciuto -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // ==========================================
      // DIMENSIONI E GEOMETRIA (Supporto 8x8 cm)
      // ==========================================
      const planeWidth = "1";   // Rapporto 1:1 (8 cm)
      const planeHeight = "1";  // Rapporto 1:1 (8 cm)

      // Profondità calcolata del pavimento: 3.5 cm su 8 cm = 0.4375
      const maxDepth = 0.4375; 
      const bottomCenterZ = maxDepth / 2;

      // ==========================================
      // TEXTURE STRUTTURA SCATOLA
      // ==========================================
      const boxTextures = {
        back: "./images/box_back.png",
        bottom: "./images/box_bottom.png"
      };

      // ==========================================
      // 1. SCATOLA 3D (BACK + BOTTOM)
      // ==========================================
      const boxGroup = document.createElement("a-entity");
      boxGroup.setAttribute("id", "diorama-box");

      const createWall = (width, height, position, rotation, texturePath) => {
        const wall = document.createElement("a-plane");
        wall.setAttribute("width", width);
        wall.setAttribute("height", height);
        wall.setAttribute("position", position);
        wall.setAttribute("rotation", rotation);
        
        if (texturePath) {
          wall.setAttribute("src", texturePath);
          wall.setAttribute("material", "transparent: true; alphaTest: 0.5; side: double; depthTest: true;");
        } else {
          wall.setAttribute("material", "color: #0b131a; roughness: 0.9; side: double; depthTest: true;");
        }
        return wall;
      };

      // Parete Fondo (8x8 cm)
      boxGroup.appendChild(createWall(planeWidth, planeHeight, "0 0 -0.005", "0 0 0", boxTextures.back));

      // Pavimento (8x3.5 cm)
      boxGroup.appendChild(createWall(planeWidth, maxDepth, `0 -0.505 ${bottomCenterZ.toFixed(4)}`, "-90 0 0", boxTextures.bottom));

      targetEntity.appendChild(boxGroup);

      // ==========================================
      // 2. I 3 LAYER Z (GIA IN POSIZIONE FINALE)
      // ==========================================
      // Layer 01 viene staccato dal fondo verso la fotocamera (Z = 0.06)
      // Layer 02 e 03 si distribuiscono fino alla fine del pavimento (Z = 0.4375)
      const layerPositionsZ = [
        0.0600,  // layer01: avanzato rispetto alla parete di fondo
        0.2487,  // layer02: posizione intermedia
        0.4375   // layer03: allineato con il bordo del pavimento
      ];

      for (let i = 1; i <= 3; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const plane = document.createElement("a-plane");
        
        plane.setAttribute("src", `./images/layer${layerNumber}.png`);
        plane.setAttribute("width", planeWidth);
        plane.setAttribute("height", planeHeight);
        
        // Impostiamo direttamente la posizione finale (senza animazione di apertura)
        const posZ = layerPositionsZ[i - 1];
        plane.setAttribute("position", `0 0 ${posZ.toFixed(4)}`);
        plane.setAttribute("scale", "1 1 1");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", 10 + i);
        targetEntity.appendChild(plane);
      }

      // ==========================================
      // 3. NEBBIA ANIMATA INTERNA + NEBBIA IN ALTO (5cm dall'alto)
      // ==========================================
      const fogContainer = document.createElement("a-entity");
      fogContainer.setAttribute("id", "fog-system");

      // Calcolo Y per i 5 cm dall'alto: 
      // Bordo superiore = +0.5. 5cm su 8cm = 0.625 unità totali dall'origine -> Y = +0.5 - 0.375 = +0.125
      const fogLayersConfig = [
        // Nebbia inferiore veloce
        { texture: "./images/fog_cloud1.png", z: 0.12, y: -0.35, xStart: -0.15, xEnd: 0.15, dur: 3500, scale: "0.9 0.40 1", opacity: 0.65 },
        { texture: "./images/fog_cloud2.png", z: 0.28, y: -0.32, xStart: 0.18, xEnd: -0.12, dur: 4500, scale: "1.1 0.50 1", opacity: 0.55 },
        { texture: "./images/fog_cloud3.png", z: 0.38, y: -0.28, xStart: -0.08, xEnd: 0.20, dur: 3000, scale: "1.3 0.60 1", opacity: 0.45 },
        
        // NUOVO LIVELLO: Nebbia alta a 5 cm dall'alto (Y = +0.125)
        { texture: "./images/fog_cloud1.png", z: 0.25, y: 0.125, xStart: -0.20, xEnd: 0.20, dur: 4000, scale: "1.2 0.35 1", opacity: 0.60 }
      ];

      fogLayersConfig.forEach((cfg, idx) => {
        const fogPlane = document.createElement("a-plane");
        
        fogPlane.setAttribute("src", cfg.texture);
        fogPlane.setAttribute("width", "1");
        fogPlane.setAttribute("height", "1");
        fogPlane.setAttribute("position", `${cfg.xStart} ${cfg.y} ${cfg.z.toFixed(4)}`);
        fogPlane.setAttribute("scale", cfg.scale);
        
        fogPlane.setAttribute("material", `
          transparent: true;
          opacity: ${cfg.opacity};
          side: double;
          depthTest: true;
          blending: additive;
        `);
        
        fogPlane.setAttribute("render-order", 50 + idx);

        // Movimento orizzontale fluttuante
        fogPlane.setAttribute("animation__drift", `
          property: position;
          to: ${cfg.xEnd} ${cfg.y} ${cfg.z.toFixed(4)};
          dir: alternate;
          loop: true;
          dur: ${cfg.dur};
          easing: easeInOutSine;
        `);

        fogPlane.setAttribute("animation__fade", `
          property: material.opacity;
          from: ${cfg.opacity * 0.35};
          to: ${cfg.opacity};
          dir: alternate;
          loop: true;
          dur: ${Math.round(cfg.dur * 0.7)};
          easing: easeInOutQuad;
        `);

        fogContainer.appendChild(fogPlane);
      });

      targetEntity.appendChild(fogContainer);
    });
  </script>
  
</body>
</html>
