<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Maledizione delle Cinque Giornate</title>


  <!-- Librerie A-Frame e MindAR (Combinazione ultra-stabile mobile) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Configurazioni esterne -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore del target riconosciuto -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // Lettura configurazione sicura con fallback
      const safeConfig = (typeof config !== "undefined") ? config : {};
      
      const totalLayers = safeConfig.layers || 4;
      const maxDepth = safeConfig.maxDepth || 0.6;
      const openDur = safeConfig.openDuration || 1500;
      const stagger = safeConfig.staggerDelay || 140;
      const easingType = safeConfig.easing || "easeOutCubic";

      // RAPPORTO D'ASPETTO RETTANGOLARE (874 / 1240 = 0.705)
      const planeWidth = (874 / 1240).toFixed(3); // 0.705
      const planeHeight = "1";

      // Calcoli geometrici 3D
      const stepDepth = totalLayers > 1 ? (maxDepth / (totalLayers - 1)) : 0;
      const topCenterZ = maxDepth / 2;
      const bottomDepth = maxDepth * 1.4;
      const bottomCenterZ = bottomDepth / 2;

      // ==========================================
      // TEXTURE STRUTTURA SCATOLA
      // ==========================================
      const boxTextures = {
        back: "./images/box_back.png",
        top: "./images/box_top.png",
        bottom: "./images/box_bottom.png"
      };

      // ==========================================
      // 1. SCATOLA 3D ADATTATA AI 874x1240 PX
      // ==========================================
      const boxGroup = document.createElement("a-entity");
      boxGroup.setAttribute("id", "diorama-box");

      const createWall = (width, height, position, rotation, texturePath) => {
        const wall = document.createElement("a-plane");
        wall.setAttribute("width", width);
        wall.setAttribute("height", height);
        wall.setAttribute("position", position);
        wall.setAttribute("rotation", rotation);
        
        if (texturePath) {
          wall.setAttribute("src", texturePath);
          wall.setAttribute("material", "transparent: true; alphaTest: 0.5; side: double; depthTest: true;");
        } else {
          wall.setAttribute("material", "color: #0b131a; roughness: 0.9; side: double; depthTest: true;");
        }
        return wall;
      };

      boxGroup.appendChild(createWall(planeWidth, planeHeight, "0 0 -0.005", "0 0 0", boxTextures.back));
      boxGroup.appendChild(createWall(planeWidth, maxDepth, `0 0.5 ${topCenterZ}`, "90 0 0", boxTextures.top));
      boxGroup.appendChild(createWall(planeWidth, bottomDepth, `0 -0.5 ${bottomCenterZ}`, "-90 0 0", boxTextures.bottom));

      targetEntity.appendChild(boxGroup);

      // ==========================================
      // 2. LAYER 3D ANIMATI
      // ==========================================
      for (let i = 1; i <= totalLayers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const plane = document.createElement("a-plane");
        
        plane.setAttribute("src", `./images/layer${layerNumber}.png`);
        plane.setAttribute("width", planeWidth);
        plane.setAttribute("height", planeHeight);
        plane.setAttribute("position", "0 0 0");
        plane.setAttribute("scale", "1 1 1");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", 10 + i);

        if (i > 1) {
          const targetZ = (i - 1) * stepDepth;
          const delayTime = (i - 1) * stagger;
          const scaleFactor = 1 + ((i - 1) / (totalLayers - 1)) * 0.28;

          plane.setAttribute("animation__pos", `
            property: position;
            from: 0 0 0;
            to: 0 0 ${targetZ.toFixed(4)};
            dur: ${openDur};
            delay: ${delayTime};
            easing: ${easingType};
            fill: forwards;
          `);

          plane.setAttribute("animation__scale", `
            property: scale;
            from: 1 1 1;
            to: ${scaleFactor} ${scaleFactor} 1;
            dur: ${openDur};
            delay: ${delayTime};
            easing: ${easingType};
            fill: forwards;
          `);
        }

        targetEntity.appendChild(plane);
      }

      // ==========================================
      // 3. SISTEMA NEBBIA AZZURRA
      // ==========================================
      const fogContainer = document.createElement("a-entity");
      fogContainer.setAttribute("id", "fog-system");

      const fogLayersConfig = [
        { texture: "./images/fog_cloud1.png", z: stepDepth * 0.8, xStart: -0.15, xEnd: 0.15, dur: 7000, scale: "0.9 0.4 1", opacity: 0.65 },
        { texture: "./images/fog_cloud2.png", z: stepDepth * 1.8, xStart: 0.18, xEnd: -0.12, dur: 9500, scale: "1.0 0.5 1", opacity: 0.50 },
        { texture: "./images/fog_cloud3.png", z: stepDepth * 2.8, xStart: -0.08, xEnd: 0.20, dur: 6000, scale: "1.1 0.6 1", opacity: 0.40 }
      ];

      fogLayersConfig.forEach((cfg, idx) => {
        const fogPlane = document.createElement("a-plane");
        
        fogPlane.setAttribute("src", cfg.texture);
        fogPlane.setAttribute("width", "1");
        fogPlane.setAttribute("height", "1");
        fogPlane.setAttribute("position", `${cfg.xStart} -0.42 ${cfg.z.toFixed(4)}`);
        fogPlane.setAttribute("scale", cfg.scale);
        
        fogPlane.setAttribute("material", `
          transparent: true;
          opacity: ${cfg.opacity};
          side: double;
          depthTest: true;
          blending: additive;
        `);
        
        fogPlane.setAttribute("render-order", 50 + idx);

        fogPlane.setAttribute("animation__drift", `
          property: position;
          to: ${cfg.xEnd} -0.42 ${cfg.z.toFixed(4)};
          dir: alternate;
          loop: true;
          dur: ${cfg.dur};
          easing: easeInOutSine;
        `);

        fogPlane.setAttribute("animation__fade", `
          property: material.opacity;
          from: ${cfg.opacity * 0.4};
          to: ${cfg.opacity};
          dir: alternate;
          loop: true;
          dur: ${cfg.dur * 0.7};
          easing: easeInOutQuad;
        `);

        fogContainer.appendChild(fogPlane);
      });

      targetEntity.appendChild(fogContainer);
    });
  </script>

</body>
</html>
