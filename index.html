<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Maledizione delle Cinque Giornate - AR</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Componente LERP bilanciato per reattività + stabilità -->
  <script>
    AFRAME.registerComponent('smooth-tracker', {
      schema: {
        factor: { type: 'number', default: 0.35 } // Aumentato a 0.35 per inseguimento reattivo senza lag
      },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;

        const object3D = this.el.object3D;
        
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }

        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- MindAR con parametri bilanciati per il nuovo Target Zebra/QR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Factor impostato a 0.35 per un riaggancio immediato durante i movimenti -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // ==========================================
      // DIMENSIONI E GEOMETRIA (Supporto 8x8 cm)
      // ==========================================
      const planeWidth = "1";   
      const planeHeight = "1";  

      const maxDepth = 0.4375; 
      const backOffsetZ = -0.005; 
      const bottomLength = maxDepth - backOffsetZ; 
      const bottomCenterZ = backOffsetZ + (bottomLength / 2); 

      // ==========================================
      // TEXTURE STRUTTURA SCATOLA
      // ==========================================
      const boxTextures = {
        back: "./images/box_back.png",
        bottom: "./images/box_bottom.png"
      };

      // ==========================================
      // 1. SCATOLA 3D (BACK + BOTTOM)
      // ==========================================
      const boxGroup = document.createElement("a-entity");
      boxGroup.setAttribute("id", "diorama-box");

      const createWall = (width, height, position, rotation, texturePath) => {
        const wall = document.createElement("a-plane");
        wall.setAttribute("width", width);
        wall.setAttribute("height", height);
        wall.setAttribute("position", position);
        wall.setAttribute("rotation", rotation);
        
        if (texturePath) {
          wall.setAttribute("src", texturePath);
          wall.setAttribute("material", "transparent: true; alphaTest: 0.5; side: double; depthTest: true;");
        } else {
          wall.setAttribute("material", "color: #0b131a; roughness: 0.9; side: double; depthTest: true;");
        }
        return wall;
      };

      boxGroup.appendChild(createWall(planeWidth, planeHeight, `0 0 ${backOffsetZ}`, "0 0 0", boxTextures.back));
      boxGroup.appendChild(createWall(planeWidth, bottomLength, `0 -0.505 ${bottomCenterZ.toFixed(4)}`, "-90 0 0", boxTextures.bottom));

      targetEntity.appendChild(boxGroup);

      // ==========================================
      // 2. I 3 LAYER Z
      // ==========================================
      const layerPositionsZ = [
        0.1900,  // Layer 01
        0.2737,  // Layer 02
        0.4375   // Layer 03 (Duomo, fine del pavimento)
      ];

      for (let i = 1; i <= 3; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const plane = document.createElement("a-plane");
        
        plane.setAttribute("src", `./images/layer${layerNumber}.png`);
        plane.setAttribute("width", planeWidth);
        plane.setAttribute("height", planeHeight);
        
        const posZ = layerPositionsZ[i - 1];
        plane.setAttribute("position", `0 0 ${posZ.toFixed(4)}`);
        plane.setAttribute("scale", "1 1 1");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", 10 + i);
        targetEntity.appendChild(plane);
      }

      // ==========================================
      // 3. NEBBIA ANIMATA INTERNA (TUTTI I LIVELLI IN BASSO)
      // ==========================================
      const fogContainer = document.createElement("a-entity");
      fogContainer.setAttribute("id", "fog-system");

      const fogLayersConfig = [
        { texture: "./images/fog_cloud1.png", z: 0.12, y: -0.35, xStart: -0.15, xEnd: 0.15, dur: 3500, scale: "0.9 0.40 1", opacity: 0.65 },
        { texture: "./images/fog_cloud2.png", z: 0.22, y: -0.32, xStart: 0.18, xEnd: -0.12, dur: 4500, scale: "1.1 0.45 1", opacity: 0.55 },
        
        // NUOVA POSIZIONE NEBBIA 4: Y in basso (-0.30) e Z = 0.3600 (davanti a Layer03 che sta a Z = 0.4375)
        { texture: "./images/fog_cloud1.png", z: 0.36, y: -0.30, xStart: -0.18, xEnd: 0.18, dur: 4200, scale: "1.2 0.50 1", opacity: 0.60 },

        { texture: "./images/fog_cloud3.png", z: 0.40, y: -0.28, xStart: -0.08, xEnd: 0.20, dur: 3000, scale: "1.3 0.50 1", opacity: 0.45 }
      ];

      fogLayersConfig.forEach((cfg, idx) => {
        const fogPlane = document.createElement("a-plane");
        
        fogPlane.setAttribute("src", cfg.texture);
        fogPlane.setAttribute("width", "1");
        fogPlane.setAttribute("height", "1");
        fogPlane.setAttribute("position", `${cfg.xStart} ${cfg.y} ${cfg.z.toFixed(4)}`);
        fogPlane.setAttribute("scale", cfg.scale);
        
        fogPlane.setAttribute("material", `
          transparent: true;
          opacity: ${cfg.opacity};
          side: double;
          depthTest: true;
          blending: additive;
        `);
        
        fogPlane.setAttribute("render-order", 50 + idx);

        fogPlane.setAttribute("animation__drift", `
          property: position;
          to: ${cfg.xEnd} ${cfg.y} ${cfg.z.toFixed(4)};
          dir: alternate;
          loop: true;
          dur: ${cfg.dur};
          easing: easeInOutSine;
        `);

        fogPlane.setAttribute("animation__fade", `
          property: material.opacity;
          from: ${cfg.opacity * 0.35};
          to: ${cfg.opacity};
          dir: alternate;
          loop: true;
          dur: ${Math.round(cfg.dur * 0.7)};
          easing: easeInOutQuad;
        `);

        fogContainer.appendChild(fogPlane);
      });

      targetEntity.appendChild(fogContainer);
    });
  </script>
  
</body>
</html>
